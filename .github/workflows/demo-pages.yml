# DEMO STAGE ONLY — deploys the site built from generated demo data to GitHub Pages.
# Replaced by .github/workflows/daily.yml (BRIEF §8) in the real build.
# No schedule: runs on push to main and manually from the Actions tab.
name: Demo site (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      scenario:
        description: "Demo scenario"
        type: choice
        default: default
        options: [default, stale, source-error, empty, large]

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Astro requires Node >= 22.23.4 for the build; Bun installs and runs scripts.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install
        run: bun install --frozen-lockfile

      - name: Generate demo data (never committed)
        run: bun run demo:generate --scenario "${SCENARIO}"
        env:
          SCENARIO: ${{ inputs.scenario || 'default' }}

      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build with the Pages base path
        run: bun run build
        env:
          DATA_MODE: demo
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SITE_URL: ${{ steps.pages.outputs.origin }}

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
