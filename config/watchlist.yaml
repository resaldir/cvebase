# cvebase watchlist — the database products we track.
# Edit by pull request. CI validates this file against src/lib/schemas/config.ts.
#
# DEMO STAGE: every CPE pair below is an UNVERIFIED placeholder (verified: false).
# In BRIEF phase 1, confirm each pair with `bun run cpe:discover <keyword>`
# against the NVD CPE API and flip it to verified: true.
#
# Fields:
#   id        slug, used in URLs (/products/<id>/) and data files
#   category  relational | nosql | tooling | driver
#   cpes      NVD CPE vendor:product pairs
#   packages  ecosystem + package name (drivers; GitHub Advisory matching)
#   aliases   keyword aliases for description matching (LOW confidence)

products:
  # ---------- Relational ----------
  - id: oracle-database
    name: Oracle Database Server
    vendor: Oracle
    category: relational
    cpes:
      - { vendor: oracle, product: database_server, verified: false }
    aliases: [Oracle Database, Oracle DB, Oracle RDBMS]
    enabled: true

  - id: mysql
    name: MySQL
    vendor: Oracle
    category: relational
    cpes:
      - { vendor: oracle, product: mysql, verified: false }
      - { vendor: oracle, product: mysql_server, verified: false }
    aliases: [MySQL, MySQL Server]
    enabled: true

  - id: mariadb
